[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testagent"
version = "0.1.0"
description = "AI-powered test case and performance script generator from requirement and API docs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "TestAgent Team" }]
dependencies = [
    "openai>=1.55.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.13.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "dependency-injector>=4.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    "types-jsonschema>=4.21",
]
documents = [
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "python-pptx>=0.6.23",
]
documents-full = [
    "docling>=2.12.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
testagent = "testagent.cli:main"

[tool.ruff]
line-length = 100
target-version = "py314"
# The ``cankao/`` directory holds third-party reference projects (langgraph,
# etc.) for study only — it is not part of TestAgent and must not be linted
# as if it were project source.
extend-exclude = ["cankao", "scripts/proto_link_graph.py", "scripts/audit_case_links.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# The web GUI embeds a large HTML/JS string with intentional Simplified-Chinese
# UI text (fullwidth punctuation). The ambiguous-character rules are
# false-positives there, so disable RUF001/002/003 for that module.
"testagent/web/app.py" = ["RUF001", "RUF002", "RUF003"]
# Consistency-check tests embed realistic CJK requirement fixtures
# (fullwidth punctuation is the honest input shape).
"testagent/pipeline/module_aliases.py" = ["RUF001", "RUF002", "RUF003"]
# R6 clause splitter and direction templates match CJK sentence punctuation
# and connector words verbatim - fullwidth characters ARE the input domain.
"testagent/pipeline/links_r6.py" = ["RUF001", "RUF002"]
# linkcheck's DECLARED_LEGEND is the v15 contract text verbatim (Chinese).
"testagent/pipeline/linkcheck.py" = ["RUF001"]
"tests/test_consistency.py" = ["RUF001"]
"tests/test_binding.py" = ["RUF001"]
"tests/test_links_r6.py" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Skip the ``cankao/`` reference projects; they are studied, not shipped, and
# contain their own (incompatible) stdlib-shadowing modules like ``typing.py``.
exclude = "(^|/)cankao/"

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "pdfplumber.*",
    "docx.*",
    "bs4.*",
    "markdownify.*",
    "pptx.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
