[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testagent"
version = "0.1.0"
description = "AI-powered test case and performance script generator from requirement and API docs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "TestAgent Team" }]
dependencies = [
    "openai>=1.55.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.13.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]
documents = [
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "python-pptx>=0.6.23",
]
documents-full = [
    "docling>=2.12.0",
]

[project.scripts]
testagent = "testagent.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "pdfplumber.*",
    "docx.*",
    "bs4.*",
    "markdownify.*",
    "pptx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
