name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      # FH2.10 (plan-k B8'): install FROM the lockfile. Before this, CI resolved
      # "latest matching version" on every run, so a green build said nothing
      # about reproducibility — and the committed uv.lock was missing
      # dependencies outright (e.g. dependency-injector), which `uv lock --check`
      # now catches.
      # A stale or incomplete lock is a hard failure, not a surprise later:
      # the committed uv.lock was missing runtime deps (dependency-injector) and
      # resolved differently from pyproject until 2026-09-20.
      - name: Lockfile is current
        run: uv lock --check

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras

      - run: uv run ruff check testagent/ tests/ scripts/
      - run: uv run ruff format --check testagent/ tests/ scripts/
      - run: uv run mypy testagent/
      - run: uv run pytest tests/ -q

      # The task-package contract gate is a hard CI step, not a manual habit.
      # links golden / R6 benchmark / engine golden / repo hygiene already run
      # inside `pytest tests/` (subprocess tests), so they need no step.
      - name: Validate task packages (strict)
        run: uv run testagent tasks validate --strict

  docker:
    name: Build & Push Docker Image (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Compute image repo and tags
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          REPO="mzdjy/testagent"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          TAGS="${REPO}:${SHORT_SHA}"

          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            TAGS="${TAGS},${REPO}:${BRANCH}"
            if [[ "${BRANCH}" == "main" || "${BRANCH}" == "master" ]]; then
              TAGS="${TAGS},${REPO}:latest"
            fi
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${REPO}:${VERSION},${REPO}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"

      # B-group fix: -p puts the secret in the process argv (visible in `ps` and
      # in the step's echoed command line); the stdin form never does.
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD2 }}
        run: docker login -u "$DOCKER_USERNAME" --password-stdin <<<"$DOCKER_PASSWORD"
        timeout: 60

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
