name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Lint + type-check + tests (runs on every push and PR)
  # ------------------------------------------------------------------
  test:
    name: Lint & Test (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python + pip cache (astral-sh/setup-uv 不负责装 Python，
      # 仅负责装 uv 二进制；enable-cache 必须有 uv.lock 才能开，
      # 本项目不引入 uv.lock，因此走 actions/setup-python 的 pip cache
      # 并用 uv pip install --system 直接安装到系统 Python)
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,documents,web]"

      - name: Ruff check
        run: ruff check testagent/ tests/

      - name: Ruff format check
        run: ruff format --check testagent/ tests/

      - name: Mypy
        run: mypy testagent/

      - name: Pytest
        run: pytest tests/ -q

  # ------------------------------------------------------------------
  # Build & push Docker image to Docker Hub
  # Only on push to main/master or version tags (skipped on PRs).
  # Uses Docker Buildx for multi-platform builds (linux/amd64 + linux/arm64).
  # ------------------------------------------------------------------
  docker:
    name: Build & Push Docker Image (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Set up QEMU for cross-compiling foreign architectures (arm64 on x86 runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Create a Buildx builder instance with multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image repo and tags
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          REPO="mzdjy/testagent"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          TAGS="${REPO}:${SHORT_SHA}"

          # Branch pushes → branch name + latest on the default branch.
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            TAGS="${TAGS},${REPO}:${BRANCH}"
            if [[ "${BRANCH}" == "main" || "${BRANCH}" == "master" ]]; then
              TAGS="${TAGS},${REPO}:latest"
            fi
          fi

          # Version tags (v1.2.3) → 1.2.3 + latest.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${REPO}:${VERSION},${REPO}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD2 }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}